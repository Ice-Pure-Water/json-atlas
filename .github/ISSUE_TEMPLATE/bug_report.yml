name: Bug report / 问题反馈
description: Report a reproducible problem / 报告可复现的问题
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, personal information, or private documents.
        请勿提供密钥、个人信息或私密文档。
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system / 浏览器和操作系统
      placeholder: Chrome 154, macOS
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Data format / 数据格式
      options: [JSON, JSONL or NDJSON, YAML, TOML, CSV, Mixed log, Other]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction / 最小复现步骤
      description: Use synthetic or redacted data only. / 仅使用构造或脱敏数据。
    validations:
      required: true
